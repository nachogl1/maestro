name: Release

# Publishes signed Windows and macOS installers on every push to main so the
# installed app can update itself (Settings → check for updates, or the
# startup banner).
#
# Version scheme: MAJOR.MINOR come from src-tauri/tauri.conf.json, PATCH is the
# run number of this workflow, so every run is strictly newer than the last.
# Renaming this file resets the run number and would make versions go
# backwards — bump MINOR in tauri.conf.json if that ever has to happen.
#
# The macOS job runs after the Windows one and adds its files to the same
# release, merging its platforms into latest.json. Running them one after the
# other avoids both jobs rewriting latest.json at once. A manual run from any
# other branch builds the macOS app without publishing, to test this workflow.
#
# Both build jobs wait for the "PR Checks" jobs (front-end and Rust suites,
# pinned-action check), run here on the pushed commit, so a failing test never
# becomes an update.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    name: Tests
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read

  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    needs: checks
    # Manual runs from other branches must not become the "latest" release.
    # Runs only when every test job passed (the implicit success() check).
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Rust
        # Pinned: Cargo 1.100's new build-dir layout breaks tauri-build 2.5.6's sidecar copy; undo once tauri-build supports it.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: 1.99.1

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Compute release version and enable updater artifacts
        id: version
        run: node .github/scripts/prepare-release-config.mjs

      - name: Install frontend dependencies
        # npm ci keeps the lockfile's @tauri-apps/* versions, which match the
        # Rust crates in Cargo.lock; a fresh npm install pulls newer minors and
        # the Tauri CLI refuses to build on the mismatch.
        run: npm ci

      - name: Build MCP server sidecar
        shell: bash
        run: |
          cargo build --release -p maestro-mcp-server
          mkdir -p src-tauri/binaries
          cp target/release/maestro-mcp-server.exe \
            src-tauri/binaries/maestro-mcp-server-x86_64-pc-windows-msvc.exe

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Maestro v${{ steps.version.outputs.version }}
          releaseBody: "Automated Windows and macOS build of ${{ github.sha }}."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles msi

  macos:
    name: Build and publish macOS app
    runs-on: macos-latest
    needs: [checks, windows]
    # Never after a failed test job. On main, wait for the Windows job to create
    # the release. On a manual run from another branch the Windows job is
    # skipped and this job only builds.
    if: >-
      !cancelled() &&
      needs.checks.result == 'success' &&
      (needs.windows.result == 'success' || github.ref != 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Rust
        # Pinned: Cargo 1.100's new build-dir layout breaks tauri-build 2.5.6's sidecar copy; undo once tauri-build supports it.
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Compute release version and enable updater artifacts
        id: version
        run: node .github/scripts/prepare-release-config.mjs --ad-hoc-sign

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MCP server sidecar
        # A universal (Apple Silicon + Intel) app builds each architecture
        # separately, so the bundler wants the sidecar under all three names.
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p maestro-mcp-server --target "$target"
            cp "target/$target/release/maestro-mcp-server" \
              "src-tauri/binaries/maestro-mcp-server-$target"
          done
          lipo -create -output src-tauri/binaries/maestro-mcp-server-universal-apple-darwin \
            src-tauri/binaries/maestro-mcp-server-aarch64-apple-darwin \
            src-tauri/binaries/maestro-mcp-server-x86_64-apple-darwin

      - name: Build app and add it to the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # An empty tag (any branch but main) builds without publishing.
          tagName: ${{ github.ref == 'refs/heads/main' && format('v{0}', steps.version.outputs.version) || '' }}
          releaseName: Maestro v${{ steps.version.outputs.version }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg
