name: PR Checks

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the run that is still going for the old
# commit, so runners only ever test the latest code.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'maestro-mcp-server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/pr-checks.yml'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm ci keeps the lockfile's @tauri-apps/* versions in step with the
        # Rust crates in Cargo.lock (same reason as release.yml).
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  rust:
    name: Rust
    needs: changes
    # Manual runs always test Rust; PRs only when Rust-side files changed.
    # A skipped job counts as passing for the PR status.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build MCP server (required by Tauri build script)
        run: |
          cargo build --release -p maestro-mcp-server
          mkdir -p src-tauri/binaries
          cp target/release/maestro-mcp-server \
            src-tauri/binaries/maestro-mcp-server-x86_64-unknown-linux-gnu

      - name: Tests
        run: cargo test --workspace
