title: Maestro
description: One screen for every AI coding session you run, and a nudge when one of them needs you.
theme: just-the-docs
url: "https://nachogl1.github.io"
baseurl: "/maestro"

logo: "/assets/images/banner.jpg"

# Links the Home page and the docs pages share.
repository_url: "https://github.com/nachogl1/maestro"
releases_url: "https://github.com/nachogl1/maestro/releases/latest"

search_enabled: true
search.heading_level: 3

heading_anchors: true

aux_links:
  GitHub: "https://github.com/nachogl1/maestro"

aux_links_new_tab: true

nav_sort: case_insensitive

color_scheme: dark

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green

# Build-only files that must never be published.
exclude:
  - Gemfile
  - Gemfile.lock
  - _vendor/
  - vendor/
  - .bundle/
